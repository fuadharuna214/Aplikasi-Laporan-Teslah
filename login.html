<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Catatan Keuangan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="w-full max-w-xs">
        <form id="loginForm" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
            <div class="mb-4">
                <h1 class="text-2xl font-bold text-center text-gray-700 mb-4">Masukkan PIN</h1>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="pin">
                    PIN
                </label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="pin" type="password" placeholder="****" maxlength="4" inputmode="numeric">
            </div>
            <p id="errorMessage" class="text-red-500 text-xs italic mb-4 hidden">PIN yang Anda masukkan salah.</p>
            <div class="flex items-center justify-between">
                <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full" type="submit">
                    Masuk
                </button>
            </div>
        </form>
        <p class="text-center text-gray-500 text-xs">
            &copy;2025 Catatan Keuangan Simpel.
        </p>
    </div>
    <script src="login.js"></script>
</body>
</html>
